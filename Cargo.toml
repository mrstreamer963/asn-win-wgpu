[package]
name = "asn-win-wgpu"
version = "0.1.0"
edition = "2024"
authors = ["Amberskynet Team"]
description = "Modern window system implementation using Winit + WGPU"
license = "MIT"
repository = "https://github.com/amberskynet/asn-win-wgpu"
keywords = ["wgpu", "winit", "graphics", "window", "rendering"]
categories = ["rendering", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
resolver = "2"
members = ["examples/ex_web_bus"]

[workspace.dependencies]
tokio = { version = "1.47", features = ["full"] }

[dependencies]
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "3.1.0", features = [] }
asn-core = { path = "./modules/asn-core" }
asn-core-bus = { path = "./modules/asn-core-bus" }
asn-gui-core = { path = "./modules/asn-gui-core" }
# Убираем проблемные модули из WASM сборки
# asn-wgpu = { path = "./modules/asn-wgpu" }
# asn-winit = { path = "./modules/asn-winit" }
# wgpu-map = { path = "./modules/gui-elements/wgpu-map" }
pollster = "0.4"

[dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rand = "0.9"
tokio-bus = { path = "./modules/tokio-bus"}
asn-wgpu = { path = "./modules/asn-wgpu" }
asn-winit = { path = "./modules/asn-winit" }
wgpu-map = { path = "./modules/gui-elements/wgpu-map" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[[example]]
name = "ex_web"
path = "examples/ex_web/src/lib.rs"
crate-type = ["cdylib"]
