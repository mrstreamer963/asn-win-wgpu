[package]
name = "ex_web_bus"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[build]
target = "wasm32-unknown-unknown"

[dependencies]
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "3.1.0", features = [
] }
asn-core = { path = "../../modules/asn-core" }
asn-core-bus = { path = "../../modules/asn-core-bus" }
tokio-bus = { path = "../../modules/tokio-bus" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
async-channel = "2.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"