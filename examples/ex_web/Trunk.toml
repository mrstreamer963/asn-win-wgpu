[build]
# The directory where the built files will be placed
dist = "dist"

# The directory where the source files are located
source = "."

# The path to the main HTML file
target = "index.html"

# Whether to watch for changes and rebuild automatically
watch = false

[serve]
# The port to serve on
port = 8091

# Whether to open the browser automatically
open = true

# Additional files to watch for changes
watch = [
    "src/**/*",
    "Cargo.toml",
    "Trunk.toml",
]

[tools]
# The version of wasm-bindgen to use
wasm-bindgen = "0.2.100"

# The version of wasm-opt to use (optional)
wasm-opt = false

[clean]
# Whether to clean the dist directory before building
dist = "dist"

# Whether to clean the pkg directory (used by wasm-pack)
pkg = true