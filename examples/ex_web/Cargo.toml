[package]
name = "ex-web"
version = "0.1.0"
edition = "2021"
authors = ["Amberskynet Team"]
description = "Web example for ASN WGPU"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[build]
target = "wasm32-unknown-unknown"

[dependencies]
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "3.1.0", features = [] }
asn-core = { path = "../../modules/asn-core" }
asn-gui-core = { path = "../../modules/asn-gui-core" }
asn-winit = { path = "../../modules/asn-winit" }
asn-wgpu = { path = "../../modules/asn-wgpu" }
wgpu-map = { path = "../../modules/gui-elements/wgpu-map" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rand = "0.10"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "Window",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
