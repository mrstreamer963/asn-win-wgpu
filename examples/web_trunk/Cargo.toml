[package]
name = "web_trunk"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[build]
target = "wasm32-unknown-unknown"

[dependencies]
asn-logger = { git = "https://github.com/amberskynet/asn-logger.git", version = "3.1.0", features = [
] }
asn-core = { path = "../../modules/asn-core" }
asn-core-bus = { path = "../../modules/asn-core-bus" }
async-channel-bus = { path = "../../modules/async-channel-bus" }
async-worker-pool = { path = "../../modules/async-worker-pool" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
async-channel = "2.5"
asn-gui-core = { path = "../../modules/asn-gui-core" }
asn-winit = { path = "../../modules/asn-winit" }
asn-wgpu = { path = "../../modules/asn-wgpu" }
wgpu-map = { path = "../../modules/gui-elements/wgpu-map" }
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "Window",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
] }
